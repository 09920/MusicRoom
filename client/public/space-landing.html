    /**
     * FadingVideo Component
     * Custom JS crossfade with requestAnimationFrame
     */
    function FadingVideo({ src, className, style }) {
      const videoRef = useRef(null);
      const rafIdRef = useRef(null);
      const fadingOutRef = useRef(false);

      const FADE_MS = 500;
      const FADE_OUT_LEAD = 0.55;

      const fadeTo = (target, duration = FADE_MS) => {
        if (!videoRef.current) return;
        if (rafIdRef.current) cancelAnimationFrame(rafIdRef.current);

        const video = videoRef.current;
        const currentOpacity = parseFloat(video.style.opacity || '0');
        const startTime = performance.now();

        const tick = (now) => {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const newOpacity = currentOpacity + (target - currentOpacity) * progress;
          if (videoRef.current) {
            videoRef.current.style.opacity = newOpacity;
          }
          if (progress < 1) {
            rafIdRef.current = requestAnimationFrame(tick);
          }
        };

        rafIdRef.current = requestAnimationFrame(tick);
      };

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        // Start video playback
        video.style.opacity = '1';
        video.play().catch(() => {});

        const handleLoadedData = () => {
          video.style.opacity = '0';
          video.play().catch(() => {});
          fadeTo(1, FADE_MS);
        };

        const handleTimeUpdate = () => {
          if (!fadingOutRef.current && video.duration && (video.duration - video.currentTime <= FADE_OUT_LEAD) && (video.duration - video.currentTime > 0)) {
            fadingOutRef.current = true;
            fadeTo(0, FADE_MS);
          }
        };

        const handleEnded = () => {
          video.style.opacity = '0';
          setTimeout(() => {
            if (videoRef.current) {
              videoRef.current.currentTime = 0;
              videoRef.current.play().catch(() => {});
              fadingOutRef.current = false;
              fadeTo(1, FADE_MS);
            }
          }, 100);
        };

        video.addEventListener('loadeddata', handleLoadedData);
        video.addEventListener('timeupdate', handleTimeUpdate);
        video.addEventListener('ended', handleEnded);

        return () => {
          if (rafIdRef.current) cancelAnimationFrame(rafIdRef.current);
          video.removeEventListener('loadeddata', handleLoadedData);
          video.removeEventListener('timeupdate', handleTimeUpdate);
          video.removeEventListener('ended', handleEnded);
        };
      }, [src]);

      return (
        <video
          ref={videoRef}
          src={src}
          className={className}
          style={{ ...style, opacity: 1 }}
          autoPlay
          muted
          playsInline
          preload="auto"
        />
      );
    }

    /**
     * BlurText Component
     * Word-by-word blur-in entrance animation
     */
    function BlurText({ text, className }) {
      const words = text.split(' ');
      const [inView, setInView] = useState(false);
      const containerRef = useRef(null);

      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setInView(true);
            }
          },
          { threshold: 0.1 }
        );

        if (containerRef.current) observer.observe(containerRef.current);
        return () => observer.disconnect();
      }, []);

      const MotionSpan = motion.span || 'span';

      return (
        <p
          ref={containerRef}
          className={className}
          style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', rowGap: '0.1em' }}
        >
          {words.map((word, i) => (
            <MotionSpan
              key={i}
              initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
              animate={inView ? {
                filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
                opacity: [0, 0.5, 1],
                y: [50, -5, 0]
              } : { filter: 'blur(10px)', opacity: 0, y: 50 }}
              transition={{
                duration: 0.7,
                times: [0, 0.5, 1],
                ease: 'easeOut',
                delay: (i * 100) / 1000
              }}
              style={{ display: 'inline-block', marginRight: '0.28em' }}
            >
              {word}
            </MotionSpan>
          ))}
        </p>
      );
    }
